[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhbot"
version = "0.1.0"
description = "A comparable, machine-readable dataset for every New Hampshire municipality (fiscal, governance, school, electoral), anchored on Census GEOIDs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "John Wallace" }]
dependencies = [
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nhbot = "nhbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
