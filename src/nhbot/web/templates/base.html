<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NHbot — New Hampshire Civic Data{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <!-- HTMX. Vendor into /static for a fully self-contained deploy. -->
  <script src="https://unpkg.com/htmx.org@2.0.3" crossorigin="anonymous"></script>
</head>
<body>
  <header class="site">
    <a class="brand" href="/">NHbot</a>
    <nav>
      <a href="/">Map</a>
      <a href="/compare">Compare towns</a>
      <a href="/about/equalized-rates">How rates work</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site">
    <p>Nonpartisan civic data for all 234 New Hampshire municipalities.
       Tax figures: NH Dept. of Revenue Administration. Boundaries: US Census.</p>
  </footer>
</body>
</html>
