<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NHDataHub — New Hampshire data{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <!-- HTMX. Vendor into /static for a fully self-contained deploy. -->
  <script src="https://unpkg.com/htmx.org@2.0.3" crossorigin="anonymous"></script>
</head>
<body>
  <header class="site">
    <a class="brand" href="/">NHDataHub</a>
    <nav>
      <a href="/state">State Data</a>
      <a href="/national">NH vs. U.S.</a>
      <a href="/towns">Town List</a>
      <a href="/compare">Tax Rate Comparison</a>
      <a href="/schools">School Spend Comparison</a>
      <a href="/political">Political Makeup</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site">
    <p class="foot-links"><a href="/about">About</a><a href="/contact">Contact</a></p>
    <p>Nonpartisan open data for all 234 New Hampshire municipalities.
       Sources cited per dataset. Boundaries: US Census.</p>
  </footer>
</body>
</html>
